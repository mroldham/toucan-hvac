{% extends "base.html" %}

{% block content %}

<div class="master-invoice-page">

    <div class="master-invoice-actions no-print">

        <a class="master-back"
           href="/invoice-center">
            ← Back to Invoices
        </a>

        <div class="master-buttons">

            <a class="invoice-btn teal"
               target="_blank"
               href="/invoices/{{ invoice.id }}/pdf">
                🖨 Print Invoice
            </a>

            <button type="button"
                    id="shareInvoiceButton"
                    class="invoice-btn orange"
                    onclick="shareInvoiceJpg(this)">
                📤 Share Invoice
            </button>

            <a class="invoice-btn teal"
               target="_blank"
               href="/invoices/{{ invoice.id }}/pdf">
                Open PDF
            </a>

            <a class="invoice-btn teal"
               href="/invoices/{{ invoice.id }}/jpg">
                Download JPG
            </a>

            <a class="invoice-btn teal"
               href="/invoice-center/{{ invoice.id }}/mark-paid">
                Mark Paid
            </a>

        </div>
    </div>

    <div class="master-preview-wrap">

        <iframe
            class="master-invoice-frame"
            src="/invoice-center/{{ invoice.id }}/preview"
            title="Toucan HVAC Invoice">
        </iframe>

    </div>

</div>


<style>

.master-invoice-page {
    width: 100%;
    padding: 18px 10px 45px;
    background: #f5fbfa;
    box-sizing: border-box;
}

.master-invoice-actions {
    width: 816px;
    max-width: calc(100% - 20px);
    margin: 0 auto 14px;
}

.master-back {
    display: inline-block;
    margin-bottom: 12px;

    background: #2db8ad;
    color: white !important;

    padding: 11px 18px;
    border-radius: 12px;

    font: 700 15px Arial, Helvetica, sans-serif;
    text-decoration: none !important;

    box-shadow: 0 3px 8px rgba(0,0,0,.12);
}

.master-buttons {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
}

.invoice-btn {
    appearance: none;
    -webkit-appearance: none;

    display: inline-flex;
    align-items: center;
    justify-content: center;

    min-height: 44px;

    padding: 10px 17px;

    border: 0;
    border-radius: 12px;

    color: white !important;

    font: 700 15px Arial, Helvetica, sans-serif !important;

    text-decoration: none !important;

    cursor: pointer;

    box-shadow: 0 3px 8px rgba(0,0,0,.15);

    box-sizing: border-box;
}

.invoice-btn.teal {
    background: #2db8ad !important;
}

.invoice-btn.orange {
    background: #ffa516 !important;
}

.invoice-btn:hover {
    transform: translateY(-1px);
}

.master-preview-wrap {
    width: 816px;
    height: 1056px;

    max-width: 100%;

    margin: 0 auto;

    background: white;

    box-shadow: 0 6px 20px rgba(0,0,0,.14);

    overflow: hidden;
}

.master-invoice-frame {
    width: 816px;
    height: 1056px;

    display: block;

    border: 0;
    margin: 0;
    padding: 0;

    background: white;
}

@media (max-width: 850px) {

    .master-preview-wrap {
        width: 100%;
        overflow: auto;
    }

    .master-invoice-frame {
        width: 816px;
    }

}

@media print {

    .no-print {
        display: none !important;
    }

    .master-invoice-page {
        padding: 0;
        background: white;
    }

    .master-preview-wrap {
        box-shadow: none;
    }

}

</style>


<script>

let invoiceShareFile = null;


async function prepareInvoiceJpg() {

    const button =
        document.getElementById("shareInvoiceButton");

    if (button) {
        button.disabled = true;
        button.innerText = "Preparing Invoice...";
    }

    try {

        const response = await fetch(
            "/invoices/{{ invoice.id }}/jpg",
            {
                credentials: "same-origin",
                cache: "no-store"
            }
        );

        if (!response.ok) {
            throw new Error(
                "Invoice JPG returned HTTP " +
                response.status
            );
        }

        const blob = await response.blob();

        invoiceShareFile = new File(
            [blob],
            "Toucan_Invoice_{{ invoice.invoice_number or invoice.id }}.jpg",
            {
                type: "image/jpeg",
                lastModified: Date.now()
            }
        );

        if (button) {
            button.disabled = false;
            button.innerText = "📤 Share Invoice";
        }

    } catch (err) {

        console.error(
            "Invoice preload failed:",
            err
        );

        if (button) {
            button.disabled = false;
            button.innerText = "Open JPG";
        }

    }
}


function shareInvoiceJpg(button) {

    if (
        invoiceShareFile &&
        navigator.share &&
        (
            !navigator.canShare ||
            navigator.canShare({
                files: [invoiceShareFile]
            })
        )
    ) {

        navigator.share({

            title:
                "Toucan HVAC Invoice #{{ invoice.invoice_number or invoice.id }}",

            files: [invoiceShareFile]

        }).catch(function(err) {

            if (err.name !== "AbortError") {

                console.error(
                    "Share failed:",
                    err
                );

                window.location.href =
                    "/invoices/{{ invoice.id }}/jpg";
            }

        });

        return;
    }

    window.location.href =
        "/invoices/{{ invoice.id }}/jpg";
}


document.addEventListener(
    "DOMContentLoaded",
    prepareInvoiceJpg
);

</script>

{% endblock %}
